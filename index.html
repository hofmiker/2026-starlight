<title>Starlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed sky canvas; floating chrome top; start card that morphs into a pill;
   compact info card (bottom-left on desktop, bottom sheet on phones).
   Two single-look skins: A atlas = aged paper (light), B cyanotype = Prussian blue (dark). */
:root { --bg:#e3d3ab; color-scheme:light; }
:root[data-skin="cyano"], :root[data-skin="warm"] { color-scheme:dark; }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
#sky { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
#app { position:fixed; inset:0; pointer-events:none; }
.ui { position:fixed; inset:0; pointer-events:none; }
.ui .panel, .ui button, .ui input, .ui .info { pointer-events:auto; }
.ui button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.ui input { font:inherit; color:inherit; }
.ui :focus-visible { outline:1px dashed currentColor; outline-offset:3px; }
.ib { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; opacity:.82; transition:opacity .2s, transform .2s; }
.ib:hover { opacity:1; }

.chrome { position:fixed; z-index:20; top:calc(22px + env(safe-area-inset-top,0px)); left:calc(22px + env(safe-area-inset-left,0px)); right:calc(22px + env(safe-area-inset-right,0px)); display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.switch { display:flex; }
.switch button { padding:.5em .95em; }
.tw-toggle { width:42px; height:42px; }

/* start card ↔ pill: geometry animated via left/top/width/height */
.card { position:fixed; overflow:hidden; z-index:10; }
.card.ready { transition:left 1s cubic-bezier(.83,0,.17,1), top 1s cubic-bezier(.83,0,.17,1), width 1s cubic-bezier(.83,0,.17,1), height 1s cubic-bezier(.83,0,.17,1); }
.card-body { position:absolute; top:0; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; transition:opacity .45s ease; }
.card.is-min .card-body { pointer-events:none; }
.card-body > * { transition:opacity .45s ease; }
.card.is-min .card-body > :not(.wordmark) { opacity:0; }
.wordmark { align-self:center; transform-origin:50% 50%; transition:transform 1s cubic-bezier(.83,0,.17,1); will-change:transform; }
.skin-cyano .wordmark { align-self:flex-start; }
.card-pill { position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; padding-right:16px; opacity:0; pointer-events:none !important; transition:opacity .45s ease .5s; }
.card.is-min .card-pill { opacity:1; pointer-events:auto !important; }
.min-btn { position:absolute; top:6px; right:6px; }
.fieldwrap { display:flex; align-items:flex-end; gap:8px; }
.field { flex:1; min-width:0; display:block; }
.go { width:46px; height:46px; display:inline-flex; align-items:center; justify-content:center; flex:none; transition:transform .2s; }
.go:hover { transform:translateX(3px); }
.err { min-height:1.3em; }
.hint { opacity:.62; }

.panning { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(40px + env(safe-area-inset-bottom,0px)); white-space:nowrap; }

.info { position:absolute; left:calc(22px + env(safe-area-inset-left,0px)); bottom:calc(22px + env(safe-area-inset-bottom,0px)); width:440px; max-width:calc(100vw - 32px); max-height:calc(100% - 110px); display:flex; flex-direction:column; }
.info-inner { display:flex; flex-direction:column; min-height:0; max-height:100%; overflow:hidden; animation:rise .7s cubic-bezier(.22,1,.36,1) both; }
.info-head { flex:none; }
.info-head { display:flex; align-items:center; gap:16px; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; }
.info-main { min-width:0; flex:1; }
.icons { display:flex; align-self:flex-start; margin:-6px -8px 0 0; }
.info-body { display:grid; grid-template-rows:1fr; flex:0 1 auto; min-height:0; transition:grid-template-rows 1s cubic-bezier(.83,0,.17,1); }
.info-body > div { overflow-y:auto; overflow-x:hidden; min-height:0; display:flex; flex-direction:column; gap:14px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.info.is-min .info-body > div { overflow:hidden; }
.info-body > div::before { content:""; display:block; height:2px; }
.info.is-min .info-body { grid-template-rows:0fr; }
.traits { list-style:none; display:flex; flex-wrap:wrap; }
.meta { display:flex; flex-wrap:wrap; gap:8px 26px; }
.meta dd { margin-top:1px; }
@media (max-width:640px) {
  .info { left:0; right:0; bottom:0; width:auto; max-width:none; max-height:40%; }
  .info-head { gap:12px; }
  .info-inner { border-left-width:0 !important; border-right-width:0 !important; border-bottom-width:0 !important; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)) !important; }
  .chrome { top:calc(16px + env(safe-area-inset-top,0px)); left:calc(16px + env(safe-area-inset-left,0px)); right:calc(16px + env(safe-area-inset-right,0px)); }
}

.tweaks { position:fixed; z-index:30; top:calc(22px + env(safe-area-inset-top,0px)); right:calc(22px + env(safe-area-inset-right,0px)); width:290px; max-width:calc(100vw - 32px); max-height:calc(100% - 44px); overflow:auto; padding:14px 16px 20px 20px; display:flex; flex-direction:column; gap:16px; }
.tw-head { display:flex; justify-content:space-between; align-items:center; }
.tw-icons { display:flex; }
.tw-row { display:flex; flex-direction:column; gap:8px; }
.tw-row input[type=range] { width:100%; accent-color:var(--acc); }
.tw-check { display:flex; align-items:center; gap:10px; }
.tw-check input { accent-color:var(--acc); width:15px; height:15px; }
.tones { display:flex; flex-wrap:wrap; gap:6px; }
.tone { display:flex; align-items:center; gap:7px; padding:5px 9px; }
.tone i { width:12px; height:12px; display:inline-block; border-radius:50%; }

.trait { padding:2px 0; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:4px; text-decoration-thickness:1px; }
.trait[aria-pressed="true"] { text-decoration-style:solid; }
.collapse { overflow:hidden; opacity:0; transition:height 1s cubic-bezier(.83,0,.17,1), opacity .6s ease; }
.collapse.is-open { opacity:1; }
.also-wrap { margin-top:-6px; }
.also { display:flex; flex-direction:column; gap:8px; padding-top:6px; }
.also-list { animation:fadein .35s ease both; }
@keyframes fadein { from { opacity:0; } to { opacity:1; } }

.also-list { display:flex; flex-wrap:wrap; gap:8px; }
.also-chip { display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 9px; }
.also-chip .g { font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',serif; font-size:1.15em; line-height:1; }
.skin-atlas .trait { color:var(--acc); font:inherit; letter-spacing:inherit; }
.skin-atlas .trait[aria-pressed="true"] { background:rgba(154,51,36,.1); padding:2px 6px; }
.skin-atlas .also-lbl { font-family:'IM Fell English SC',Georgia,serif; letter-spacing:.12em; font-size:13px; color:var(--ink2); }

.skin-atlas .also-chip .g { color:var(--acc); font-style:normal; }
.skin-atlas .also-chip:hover { background:rgba(42,28,16,.06); }
.skin-cyano .trait { font:inherit; letter-spacing:inherit; text-transform:inherit; }
.skin-cyano .trait[aria-pressed="true"] { background:var(--w); color:var(--ground); text-decoration:none; padding:2px 6px; }
.skin-cyano .also-lbl { font-family:'IBM Plex Mono',ui-monospace,monospace; text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--w2); }
.skin-cyano .also-chip { border:1px solid var(--w3); font-size:19px; }
.skin-cyano .also-chip:hover { border-color:var(--w); }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) {
  .info-inner { animation:none; }
  .card.ready, .card-body, .card-pill, .info-body { transition:none; }
}

/* ══════ A · Atlas ══════ */
.skin-atlas { --ink:#2a1c10; --ink2:#5d4428; font-family:'IM Fell English','Iowan Old Style',Georgia,serif; color:var(--ink); }

.skin-atlas .info .eyebrow { font-size:14px; letter-spacing:.12em; }
.skin-atlas h2 { font-style:italic; font-weight:400; font-size:44px; line-height:1.02; }
.skin-atlas .info-body > div::before { border-top:1px solid var(--ink2); margin-top:16px; height:0; }
.skin-atlas .desc { font-size:19px; line-height:1.5; }

.skin-atlas .meta dd { font-size:17px; }
.skin-atlas .tone[aria-pressed="true"] { outline:1px solid var(--ink); }

/* ══════ B · Cyanotypie ══════ */
.skin-cyano { --w:#f1f5fc; --w2:rgba(241,245,252,.74); --w3:rgba(241,245,252,.34); font-family:'Instrument Serif','Times New Roman',serif; color:var(--w); }

@media (max-width:560px) {

  .skin-atlas h1 { font-size:46px; } .skin-cyano h1 { font-size:58px; }

  .skin-atlas .desc { font-size:17px; } .skin-cyano .desc { font-size:18px; }
  .skin-atlas .info-inner, .skin-cyano .info-inner { padding:14px 16px 16px; }

.field { width:100%; }
.skin-atlas .cta { margin-top:10px; padding:.7em; font-family:'IM Fell English SC',Georgia,serif; letter-spacing:.2em; font-size:17px; color:var(--acc); border-top:1px solid var(--ink2) !important; border-bottom:1px solid var(--ink2) !important; transition:background .2s; }

.skin-cyano .cta:hover { opacity:.88; }

/* ══════ C · Sternzeichen (warm, close, emotional) ══════ */
.skin-warm { --t:#fbeff3; --t2:rgba(251,239,243,.74); --t3:rgba(251,239,243,.42); --line:rgba(255,220,235,.2); font-family:'Figtree',system-ui,-apple-system,sans-serif; color:var(--t); }

.skin-warm .switch { border-radius:999px; overflow:hidden; }

.skin-warm .sub { font-family:'Fraunces',Georgia,serif; font-size:21px; font-weight:300; color:var(--t2); margin-bottom:22px; }

.skin-warm .err { font-size:15px; color:#ffc4c9; }
.skin-warm .cta { margin-top:4px; padding:15px 20px; border-radius:999px; background:linear-gradient(135deg, var(--acc), color-mix(in srgb,var(--acc) 55%, #fff)); color:#2a1236; font-weight:600; font-size:16px; letter-spacing:.01em; box-shadow:0 8px 26px color-mix(in srgb,var(--acc) 35%,transparent); transition:transform .2s, box-shadow .2s; }
.skin-warm .cta:hover { transform:translateY(-1px); box-shadow:0 12px 32px color-mix(in srgb,var(--acc) 45%,transparent); }
.skin-warm .foot { margin-top:14px; font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:16px; color:var(--t2); }
.skin-warm .hint { font-size:13px; color:var(--t3); }
.skin-warm .pill-title { font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:300; font-size:28px; }
.skin-warm .panning { font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:20px; color:var(--t); text-shadow:0 0 18px color-mix(in srgb,var(--acc) 70%,transparent); }
.skin-warm .info { width:430px; }
.skin-warm .info-inner { padding:22px 24px 24px; }
.skin-warm .sym { width:66px; height:66px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:34px; line-height:1; color:#2a1236; background:radial-gradient(circle at 35% 30%, #fff, var(--acc) 70%); box-shadow:0 0 30px color-mix(in srgb,var(--acc) 55%,transparent); font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',serif; }
.skin-warm .info .eyebrow { font-size:12px; }
.skin-warm h2 { font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:46px; line-height:1; letter-spacing:-.01em; }
.skin-warm .dates { font-size:13px; color:var(--t2); margin-top:4px; }
.skin-warm .info-body > div { gap:14px; }
.skin-warm .info-body > div::before { border-top:1px solid var(--line); margin-top:16px; height:0; }
.skin-warm .desc { font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:19px; line-height:1.45; }
.skin-warm .traits { gap:8px; }
.skin-warm .trait { font-size:14px; font-weight:500; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); text-decoration:none; transition:background .2s, color .2s, border-color .2s; }
.skin-warm .trait:hover { border-color:var(--acc); }
.skin-warm .trait[aria-pressed="true"] { background:var(--acc); color:#2a1236; border-color:var(--acc); }
.skin-warm .also-lbl { font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); }

bol:"\u264E",element:"Luft",planet:"Venus",dateRange:"23. September \u2013 22. Oktober",desc:"Sucht Harmonie und Gerechtigkeit, mit feinem Sinn f\xFCr Sch\xF6nheit.",traits:["Harmonisch","Charmant","Kommunikativ","Sinnlich"]},scorpio:{name:"Skorpion",latin:"Scorpius",symbol:"\u264F",element:"Wasser",planet:"Pluto",dateRange:"23. Oktober \u2013 21. November",desc:"Intensiv und tiefgr\xFCndig. Erfindet sich immer wieder neu.",traits:["Leidenschaftlich","Intuitiv","Ehrgeizig"]},sagittarius:{name:"Sch\xFCtze",latin:"Sagittarius",symbol:"\u2650",element:"Feuer",planet:"Jupiter",dateRange:"22. November \u2013 21. Dezember",desc:"Freiheitsliebend und neugierig. Immer unterwegs zu neuen Horizonten.",traits:["Neugierig","Unabh\xE4ngig","Gro\xDFz\xFCgig","Spontan"]},capricorn:{name:"Steinbock",latin:"Capricornus",symbol:"\u2651",element:"Erde",planet:"Saturn",dateRange:"22. Dezember \u2013 19. Januar",desc:"Diszipliniert und ausdauernd. Steigt beharrlich bis zum Gipfel.",traits:["Ehrgeizig","Geduldig","Zuverl\xE4ssig"]},aquarius:{name:"Wassermann",latin:"Aquarius",symbol:"\u2652",element:"Luft",planet:"Uranus",dateRange:"20. Januar \u2013 18. Februar",desc:"Originell und unabh\xE4ngig. Denkt der Zeit einen Schritt voraus.",traits:["Unabh\xE4ngig","Kreativ","Analytisch"]},pisces:{name:"Fische",latin:"Pisces",symbol:"\u2653",element:"Wasser",planet:"Neptun",dateRange:"19. Februar \u2013 20. M\xE4rz",desc:"Einf\xFChlsam und tr\xE4umerisch. Sp\xFCrt, was andere bewegt.",traits:["Einf\xFChlsam","Kreativ","Intuitiv","Harmonisch"]}},WARM={aries:{you:"Du bist Feuer und Aufbruch. Wenn andere noch \xFCberlegen, bist du l\xE4ngst unterwegs, und genau das macht dich so ansteckend. Dein Herz schl\xE4gt f\xFCr alles, was neu beginnt.",love:"Du liebst mit voller Wucht und ganz ehrlich. Halbe Sachen sind nichts f\xFCr dich.",strength:"Mut, der andere mitrei\xDFt.",shadow:"Ungeduld, wenn es nicht schnell genug geht."},taurus:{you:"Du bist der ruhige Pol, an dem sich andere festhalten. Du wei\xDFt genau, was dir guttut: gutes Essen, warme H\xE4nde, ein Zuhause, das nach dir riecht. Was du liebst, l\xE4sst du nicht mehr los.",love:"Du schenkst Treue, die bleibt, und zeigst Liebe am liebsten mit kleinen Gesten.",strength:"Verl\xE4sslichkeit, die Sicherheit gibt.",shadow:"Sturheit, wenn sich etwas \xE4ndern soll."},gemini:{you:"In dir wohnen viele Stimmen, und jede hat etwas zu erz\xE4hlen. Du sammelst Ideen wie andere Postkarten und bringst Menschen zusammen, die sich sonst nie begegnet w\xE4ren.",love:"Du verliebst dich zuerst in einen Kopf. Wer dich zum Lachen bringt, hat schon gewonnen.",strength:"Leichtigkeit und Witz.",shadow:"Unruhe, wenn es zu still wird."},cancer:{you:"Du f\xFChlst mehr, als du zeigst. Hinter deiner Schale steckt ein weiches Herz, das sich um alle k\xFCmmert, die du liebst. Bei dir f\xFChlen sich Menschen zu Hause.",love:"Du liebst beh\xFCtend und tief. Geborgenheit ist dein sch\xF6nstes Geschenk.",strength:"Ein feines Gesp\xFCr f\xFCr das, was andere brauchen.",shadow:"R\xFCckzug, wenn du dich verletzt f\xFChlst."},leo:{you:"Du hast dieses Leuchten, das jeden Raum f\xFCllt. Du gibst gern, lachst laut und stehst f\xFCr die Menschen ein, die dir wichtig sind. Wer mit dir unterwegs ist, f\xFChlt sich gesehen.",love:"Du liebst gro\xDFz\xFCgig und mit ganzem Herzen und m\xF6chtest genauso bewundert werden.",strength:"W\xE4rme, die andere aufbl\xFChen l\xE4sst.",shadow:"Stolz, der Fehler nur schwer zugibt."},virgo:{you:"Du siehst die Details, die anderen entgehen. Hinter deiner Ordnung steckt F\xFCrsorge: Du willst, dass es den Menschen um dich gut geht. Deine Hilfe kommt leise und genau im richtigen Moment.",love:"Du zeigst Liebe durch Taten. Du merkst dir, wie jemand seinen Kaffee trinkt.",strength:"Klarheit und echte Hilfsbereitschaft.",shadow:"Du bist oft zu streng mit dir selbst."},libra:{you:"Du suchst \xFCberall die Balance und findest Sch\xF6nheit, wo andere vorbeigehen. Streit tut dir fast k\xF6rperlich weh, darum baust du Br\x
